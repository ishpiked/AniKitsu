      stroke-width="9"
      stroke-linecap="round"
    />

  </g>


  <g class="whisker right lower">

    <path
      d="M461 420 L486 434"
      stroke="url(#catGradient)"
      stroke-width="9"
      stroke-linecap="round"
    />

  </g>

</svg>
